modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/steefan1998/VanillaShader/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "clarityshader_icon.png"
displayURL = "https://github.com/steefan1998/VanillaShader"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "clarityshader.mixins.json"

# Sodium picks this class up and adds our options to its Video Settings screen.
[modproperties.${mod_id}]
"sodium:config_api_user" = "nl.chaos.clarityshader.compat.SodiumOptions"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "weatherstory"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "distanthorizons"
type = "optional"
versionRange = "[3.3,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "sodium"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
